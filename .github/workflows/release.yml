name: Release

# Push a vX.Y.Z tag → publish a GitHub Release and attach install.sh, so
# https://github.com/rundesk-ai/desk-cli/releases/latest/download/install.sh
# always serves the installer that shipped with the newest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            install.sh
